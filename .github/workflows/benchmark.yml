name: Benchmark

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install toon-parser
        run: |
          pip install maturin
          maturin build --release --out dist
          pip install dist/*.whl

      - name: Install benchmark dependencies
        run: pip install -r benchmarks/requirements.txt

      - name: Run benchmarks (3 independent trials)
        run: |
          for i in 1 2 3; do
            pytest benchmarks/ --benchmark-only --benchmark-json="benchmark-run-$i.json"
          done

      - name: Update README benchmark table (median of the 3 runs)
        run: python benchmarks/render_readme_table.py README.md benchmark-run-1.json benchmark-run-2.json benchmark-run-3.json

      - name: Open PR with refreshed results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "No change in benchmark results, nothing to open a PR for."
            exit 0
          fi

          BRANCH="benchmark-results-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "docs: refresh benchmark results"
          git push origin "$BRANCH"
          gh pr create \
            --title "Refresh benchmark results" \
            --body "Automated run of the benchmark harness (workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --base main \
            --head "$BRANCH"
